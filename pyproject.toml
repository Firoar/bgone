[project]
name = "bgone"
version = "0.1.0"
description = "Local, offline background removal for image folders (BiRefNet, terminal CLI)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Firoar" }]
keywords = ["background-removal", "birefnet", "onnx", "cli", "image-processing"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "onnxruntime>=1.20",
  "numpy>=1.26",
  "pillow>=11.0",
  "pillow-heif>=0.20",
]

[project.urls]
Repository = "https://github.com/Firoar/bgone"
Issues = "https://github.com/Firoar/bgone/issues"

[project.scripts]
bgone = "bgone.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bgone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
